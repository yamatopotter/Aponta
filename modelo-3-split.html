<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelo 3 · Split — Aponta · Canguru · TrackHub</title>
<style>
  :root{
    --ease: cubic-bezier(.22,1,.36,1);
    --accent: #55704F;
    --accent2: #a3402e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{ height:100%; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; overflow:hidden; background:#0c0c0c; }

  .stage{ position:relative; width:100vw; height:100vh; display:flex; }

  /* -------- LEFT: logo panel -------- */
  .left{
    width:44%; height:100%;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000));
    transition:background 1s var(--ease);
  }
  .orbit{ position:absolute; border:1px solid rgba(255,255,255,.18); border-radius:50%; top:50%; left:50%; }
  .orbit.o1{ width:340px;height:340px; margin:-170px 0 0 -170px; animation:spin 30s linear infinite; }
  .orbit.o2{ width:460px;height:460px; margin:-230px 0 0 -230px; animation:spin 46s linear infinite reverse; }
  .orbit.o3{ width:580px;height:580px; margin:-290px 0 0 -290px; animation:spin 60s linear infinite; opacity:.6;}
  .satellite{ position:absolute; width:12px;height:12px; border-radius:50%; background:#fff; top:-6px; left:50%; margin-left:-6px; box-shadow:0 0 16px rgba(255,255,255,.7); }
  .shape{ position:absolute; opacity:.5; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes spinRev{ to{ transform:rotate(-360deg); } }

  .logo-stage{
    position:relative; z-index:5;
    width:200px;height:200px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.98);
    border-radius:44px;
    box-shadow:0 30px 70px rgba(0,0,0,.35);
    animation:floaty 5.5s ease-in-out infinite;
    transition:transform .3s;
  }
  .logo-stage svg,.logo-stage img{ width:60%; height:60%; }
  @keyframes floaty{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-16px) rotate(-1.2deg);} }

  .left-eyebrow{
    position:absolute; bottom:56px; left:56px; z-index:5;
    color:rgba(255,255,255,.85);
    font-size:.75rem; letter-spacing:.28em; text-transform:uppercase; font-weight:700;
  }

  /* -------- RIGHT: text panel -------- */
  .right{
    width:56%; height:100%;
    background:#111214;
    display:flex; align-items:center;
    padding:0 80px;
    position:relative;
    overflow:hidden;
  }
  .right::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(600px 400px at 100% 0%, rgba(255,255,255,.04), transparent 60%);
  }
  .textblock{ max-width:560px; position:relative; z-index:2; }
  .idx{ font-size:.8rem; font-weight:800; letter-spacing:.2em; color:var(--accent); margin-bottom:16px; transition:color 1s var(--ease); }
  h1{ font-size:clamp(2.4rem,5vw,4rem); font-weight:800; color:#fff; letter-spacing:-.02em; margin-bottom:10px; line-height:1.2; padding-bottom:.08em; }
  .tagline{ font-size:1.15rem; font-weight:600; color:var(--accent); margin-bottom:20px; transition:color 1s var(--ease); }
  .desc{ font-size:1rem; line-height:1.75; color:#b9bcc2; margin-bottom:28px; }
  .feature-list{ display:flex; flex-direction:column; gap:12px; }
  .feature{ display:flex; align-items:center; gap:12px; font-size:.92rem; color:#d8dade; opacity:0; transform:translateX(-10px); }
  .feature .ic{ width:22px;height:22px; border-radius:50%; display:flex;align-items:center;justify-content:center; background:var(--accent); flex-shrink:0; transition:background 1s var(--ease); }
  .feature .ic svg{ width:12px;height:12px; stroke:#fff; }

  .textblock.enter h1, .textblock.enter .idx, .textblock.enter .tagline, .textblock.enter .desc{
    animation:fadeUp .7s var(--ease) forwards;
  }
  .textblock.enter .idx{ animation-delay:.05s; }
  .textblock.enter h1{ animation-delay:.12s; }
  .textblock.enter .tagline{ animation-delay:.2s; }
  .textblock.enter .desc{ animation-delay:.3s; }
  .textblock.enter .feature{ animation:fadeUp .5s var(--ease) forwards; }
  .textblock.enter .feature:nth-child(1){ animation-delay:.38s; }
  .textblock.enter .feature:nth-child(2){ animation-delay:.45s; }
  .textblock.enter .feature:nth-child(3){ animation-delay:.52s; }
  .textblock.enter .feature:nth-child(4){ animation-delay:.59s; }
  .textblock.enter .feature:nth-child(5){ animation-delay:.66s; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  .idx, h1, .tagline, .desc{ opacity:0; }

  /* -------- nav (vertical tabs) -------- */
  .tabs{ position:fixed; right:36px; top:50%; transform:translateY(-50%); z-index:50; display:flex; flex-direction:column; gap:26px; }
  .tab{ display:flex; align-items:center; gap:10px; cursor:pointer; background:none; border:none; }
  .tab .line{ width:26px; height:2px; background:rgba(255,255,255,.25); transition:all .3s var(--ease); }
  .tab .lbl{ font-size:.7rem; letter-spacing:.18em; color:rgba(255,255,255,.35); font-weight:700; transition:color .3s; }
  .tab.active .line{ width:42px; background:#fff; }
  .tab.active .lbl{ color:#fff; }

  .model-tag{ position:fixed; top:24px; left:32px; z-index:50; font-size:.72rem; letter-spacing:.24em; text-transform:uppercase; color:rgba(255,255,255,.4); }

  @media (max-width:860px){
    .stage{ flex-direction:column; }
    .left,.right{ width:100%; }
    .left{ height:38%; }
    .right{ height:62%; padding:36px; }
  }
</style>
</head>

</div>

</div>

  const root = document.documentElement;
  const leftPanel = document.getElementById('leftPanel');
  const logoStage = document.getElementById('logoStage');
  const leftEyebrow = document.getElementById('leftEyebrow');
  const textblock = document.getElementById('textblock');
  const idxLbl = document.getElementById('idxLbl');
  const titleLbl = document.getElementById('titleLbl');
  const taglineLbl = document.getElementById('taglineLbl');
  const descLbl = document.getElementById('descLbl');
  const featureList = document.getElementById('featureList');
  const tabs = Array.from(document.querySelectorAll('.tab'));

  function renderFeatures(list){
    featureList.innerHTML = list.map(f=>`<div class="feature"><span class="ic">${check}</span>${f}</div>`).join('');
  }

  function show(i){
    const d = data[i];
    root.style.setProperty('--accent', d.accent);
    root.style.setProperty('--accent2', d.accent2);
    logoStage.innerHTML = d.logo;
    leftEyebrow.textContent = d.eyebrow;
    idxLbl.textContent = d.idx;
    titleLbl.textContent = d.title;
    taglineLbl.textContent = d.tagline;
    descLbl.textContent = d.desc;
    renderFeatures(d.features);

    tabs.forEach((t,ti)=>t.classList.toggle('active', ti===i));

    // replay entrance animation
    textblock.classList.remove('enter');
    void textblock.offsetWidth;
    textblock.classList.add('enter');
  }

  tabs.forEach(t=>t.addEventListener('click', ()=> show(+t.dataset.i)));

  let current = 0;
  window.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown' || e.key==='ArrowRight'){ current=(current+1)%3; show(current); }
    if(e.key==='ArrowUp' || e.key==='ArrowLeft'){ current=(current-1+3)%3; show(current); }
  });
  tabs.forEach(t=>t.addEventListener('click', ()=>{ current = +t.dataset.i; }));

  show(0);

  // auto-advance every 9s (subtle, can be ignored by user interaction)
  let auto = setInterval(()=>{ current=(current+1)%3; show(current); }, 9000);
  document.addEventListener('click', ()=>{ clearInterval(auto); });
  window.addEventListener('keydown', ()=>{ clearInterval(auto); });
</script>
